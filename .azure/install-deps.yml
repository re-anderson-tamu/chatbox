steps:
  - task: NodeTool@0
    displayName: Install Node.js $(NODE_VERSION)
    inputs:
      versionSpec: $(NODE_VERSION)

  - script: npm install -g pnpm@$(PNPM_VERSION)
    displayName: Install pnpm

  # Cache node_modules keyed on the lockfile — on a hit, pnpm install is skipped
  # entirely (linking ~3000 packages is what makes installs slow, not downloading).
  - task: Cache@2
    displayName: Cache node_modules
    inputs:
      key: 'node_modules | "$(Agent.OS)" | pnpm-lock.yaml'
      path: node_modules
      cacheHitVar: NODE_MODULES_CACHE_HIT

  # Fallback: cache the pnpm content store so a cold node_modules build avoids
  # re-downloading packages.
  - task: Cache@2
    displayName: Cache pnpm store
    inputs:
      key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
      restoreKeys: 'pnpm | "$(Agent.OS)"'
      path: $(PNPM_STORE_PATH)

  - script: pnpm config set store-dir $(PNPM_STORE_PATH)
    displayName: Point pnpm at cache directory

  - script: pnpm install --frozen-lockfile --prefer-offline
    displayName: Install dependencies
    condition: ne(variables.NODE_MODULES_CACHE_HIT, 'true')
