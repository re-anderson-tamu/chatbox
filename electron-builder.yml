productName: NRI Quercus
appId: edu.tamu.nri.quercus
asar: true
asarUnpack:
  - "**\\*.{node,dll}"
  - '**/node_modules/libsql/**'
files:
  - 'dist'
  # - "!dist/**/*.map"
  # - "!dist/**/stats.html"
  - 'node_modules'
  - 'package.json'

afterSign: .erb/scripts/notarize.js
afterPack: .erb/scripts/patch-libsql.cjs

# releaseInfo:
#   releaseNotes: See the changelog for details

mac:
  notarize: false
  category: public.app-category.developer-tools
  target:
    target: default
    arch:
      - x64
  type: distribution
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  gatekeeperAssess: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
  verifyUpdateCodeSignature: false
  artifactName: ${productName}-${version}-Setup.${ext}
  sign: ./custom_win_sign.js
  signingHashAlgorithms:
    - sha256

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: assets/installer.nsh
  installerSidebar: assets/installerSidebar.bmp

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  app: release/app
  buildResources: assets
  output: release/build

extraResources:
  - ./assets/**

publish:
  # Generic provider: electron-updater checks {url}/{channel}.yml for updates
  # and downloads installers from {url}/{filename}.
  # Files are uploaded to Azure Blob Storage by the release pipeline.
  # Files are served from https://nriquercus.blob.core.windows.net/releases/<channel>/
  - provider: generic
    url: https://nriquercus.blob.core.windows.net/releases/${env.UPDATE_CHANNEL}
